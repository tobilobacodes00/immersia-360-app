name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typed routes: generates .expo/types/router.d.ts, which the dev server would otherwise write.
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      # Bundles the JavaScript the way Expo Go and the app load it: catches missing assets and imports that
      # type checks cannot see.
      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir /tmp/expo-export
      - name: Expo doctor
        run: npx expo-doctor

  engine:
    name: Video engine (Swift, macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modules/immersia-composer/ios
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Builds Core/ as a Swift package and runs its tests against synthetic clips (see Tests/).
      - run: swift test

  worker:
    name: Sharing server (Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
